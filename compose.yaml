name: cataloggate

x-app-environment: &app-environment
  DATABASE_URL: postgres://cataloggate_app:${POSTGRES_APP_PASSWORD:?run node scripts/bootstrap.mjs}@postgres:5432/cataloggate
  MONGO_DB: cataloggate
  RABBIT_URL: amqp://cataloggate:${RABBIT_PASSWORD:?run node scripts/bootstrap.mjs}@rabbitmq:5672/cataloggate?heartbeat=5

x-read-environment: &read-environment
  MONGO_URL: mongodb://audit_reader:${MONGO_READER_PASSWORD:?run node scripts/bootstrap.mjs}@mongo:27017/?authSource=cataloggate
  REDIS_URL: redis://:${REDIS_PASSWORD:?run node scripts/bootstrap.mjs}@redis:6379

x-runtime: &runtime
  image: cataloggate-runtime:local
  build:
    context: .
    target: runtime
  init: true

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cataloggate_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?run node scripts/bootstrap.mjs}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?run node scripts/bootstrap.mjs}
      POSTGRES_DB: cataloggate
    volumes:
      - postgres-secure-data:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, cataloggate_migrator, -d, cataloggate]
      interval: 2s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0-noble
    environment:
      MONGO_INITDB_ROOT_USERNAME: cataloggate_mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD:?run node scripts/bootstrap.mjs}
      MONGO_INITDB_DATABASE: cataloggate
      MONGO_READER_PASSWORD: ${MONGO_READER_PASSWORD:?run node scripts/bootstrap.mjs}
      MONGO_WORKER_PASSWORD: ${MONGO_WORKER_PASSWORD:?run node scripts/bootstrap.mjs}
    volumes:
      - mongo-secure-data:/data/db
      - ./infra/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [CMD, mongosh, --quiet, --host, mongo, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
      interval: 3s
      timeout: 5s
      retries: 20

  rabbitmq:
    hostname: cataloggate-rabbitmq
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: cataloggate
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:?run node scripts/bootstrap.mjs}
      RABBITMQ_DEFAULT_VHOST: cataloggate
    volumes:
      - rabbit-secure-data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, check_port_listener, '5672']
      interval: 4s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run node scripts/bootstrap.mjs}
    command:
      - sh
      - -ec
      - |
        umask 077
        config=$$(mktemp)
        case "$$REDIS_PASSWORD" in *[!0-9a-f]*|'') exit 1;; esac
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > "$$config"
        exec redis-server "$$config"
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *runtime
    command: [node, dist/platform/migrate.js]
    environment:
      DATABASE_URL: postgres://cataloggate_migrator:${POSTGRES_MIGRATION_PASSWORD:?run node scripts/bootstrap.mjs}@postgres:5432/cataloggate
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *runtime
    environment:
      <<: [*app-environment, *read-environment]
      HOST: 0.0.0.0
      PORT: '3000'
    ports:
      - '127.0.0.1:${CATALOGGATE_PORT:-3180}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

  worker:
    <<: *runtime
    command: [node, dist/main-worker.js]
    environment:
      <<: *app-environment
      MONGO_URL: mongodb://audit_worker:${MONGO_WORKER_PASSWORD:?run node scripts/bootstrap.mjs}@mongo:27017/?authSource=cataloggate
    depends_on:
      migrate:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  checks:
    profiles: [qa]
    build:
      context: .
      target: checks
    environment:
      <<: [*app-environment, *read-environment]
      CATALOGGATE_URL: http://api:3000

volumes:
  postgres-secure-data:
  mongo-secure-data:
  rabbit-secure-data:
