openapi: 3.1.0
info:
  title: CatalogGate
  version: 0.1.0
  description: Auditoria assíncrona de lotes de fornecedores fictícios.
servers:
  - url: http://127.0.0.1:3180
security:
  - DemoBearer: []
paths:
  /imports:
    post:
      operationId: submitImport
      summary: Registra um lote para auditoria
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [supplier, items]
              properties:
                supplier: { type: string, enum: [northwind, trailforge] }
                items:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: {}
            example:
              supplier: northwind
              items:
                - { sku: FRAME-42, stock: 4 }
                - { sku: CHAIN-18, stock: -3 }
      responses:
        '202':
          description: Lote registrado ou protocolo existente para um replay equivalente
          headers:
            Location:
              schema: { type: string }
              example: /imports/9d9699c0-d2e6-4b1e-b013-6f3a2faf14af
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/BodyTooLarge' }
  /imports/{id}:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      operationId: readImport
      summary: Consulta o estado do protocolo
      responses:
        '200':
          description: Estado da importação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /imports/{id}/report:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      operationId: readReport
      summary: Consulta os itens aceitos e os motivos de rejeição
      responses:
        '200':
          description: Relatório concluído
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503':
          description: Relatório indisponível nas fontes duráveis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Failure' }
  /imports/{id}/preview:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      operationId: previewCatalog
      summary: Compara os SKUs de um lote válido com a versão atual
      responses:
        '200':
          description: Prévia e versão base
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Preview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /imports/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    post:
      operationId: publishCatalog
      summary: Publica um lote auditado como revisor autorizado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              additionalProperties: false
              properties:
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        '201':
          description: Versão publicada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /imports/{id}/release:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      operationId: readCatalogRelease
      summary: Consulta a decisão e as mudanças de um lote publicado
      responses:
        '200':
          description: Registro da publicação
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Release' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /imports/{id}/attempts:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    get:
      operationId: importAttemptHistory
      summary: Consulta até 50 tentativas recentes e as solicitações de reprocessamento
      responses:
        '200':
          description: Histórico operacional do lote
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /imports/{id}/retry:
    parameters:
      - $ref: '#/components/parameters/ImportId'
    post:
      operationId: reprocessFailedImport
      summary: Solicita reprocessamento de um lote em falha técnica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedGeneration]
              additionalProperties: false
              properties:
                expectedGeneration: { type: integer, minimum: 1, maximum: 6 }
      responses:
        '202':
          description: Nova geração registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetryReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /ops/metrics:
    get:
      operationId: readSupplierMetrics
      summary: Consulta indicadores operacionais do fornecedor autenticado
      responses:
        '200':
          description: Indicadores por fornecedor para revisores
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupplierMetrics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /health:
    get:
      security: []
      operationId: health
      summary: Verifica se a API responde
      responses:
        '200':
          description: API em execução
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
components:
  securitySchemes:
    DemoBearer:
      type: http
      scheme: bearer
      description: Chave local do operador ou revisor provisionado.
  parameters:
    ImportId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Credencial Bearer ausente ou inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Failure' }
    Forbidden:
      description: Função não autorizada para executar a ação
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Failure' }
    BadRequest:
      description: Entrada inválida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Failure' }
    NotFound:
      description: Importação ou fornecedor não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Failure' }
    Conflict:
      description: Chave usada para outro lote ou relatório ainda indisponível
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Failure' }
    BodyTooLarge:
      description: Corpo maior que 128 KiB
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Failure' }
  schemas:
    StockChange:
      type: object
      required: [sku, before, after, kind]
      properties:
        sku: { type: string }
        before: { type: [integer, 'null'], minimum: 0 }
        after: { type: integer, minimum: 0 }
        kind: { enum: [added, updated, unchanged] }
    Preview:
      type: object
      required: [importId, supplier, baseVersion, changes]
      properties:
        importId: { type: string, format: uuid }
        supplier: { type: string }
        baseVersion: { type: integer, minimum: 0 }
        changes:
          type: array
          items: { $ref: '#/components/schemas/StockChange' }
    Release:
      type: object
      required: [importId, supplier, version, approvedBy, publishedAt, changes]
      properties:
        importId: { type: string, format: uuid }
        supplier: { type: string }
        version: { type: integer, minimum: 1 }
        approvedBy: { type: string }
        publishedAt: { type: string, format: date-time }
        changes:
          type: array
          items: { $ref: '#/components/schemas/StockChange' }
    Totals:
      type: object
      required: [accepted, rejected]
      properties:
        accepted: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
    ImportStatus:
      type: object
      required: [id, supplier, status, generation, itemCount, submittedAt, finishedAt, totals]
      properties:
        id: { type: string, format: uuid }
        supplier: { type: string }
        status: { enum: [pending, completed, failed] }
        generation: { type: integer, minimum: 1, maximum: 6 }
        itemCount: { type: integer, minimum: 1, maximum: 500 }
        submittedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        totals:
          oneOf:
            - $ref: '#/components/schemas/Totals'
            - type: 'null'
    AuditReport:
      type: object
      required: [id, supplier, totals, accepted, rejected]
      properties:
        id: { type: string, format: uuid }
        supplier: { type: string }
        totals: { $ref: '#/components/schemas/Totals' }
        accepted:
          type: array
          items:
            type: object
            required: [row, sku, stock]
            properties:
              row: { type: integer, minimum: 1 }
              sku: { type: string }
              stock: { type: integer, minimum: 0 }
        rejected:
          type: array
          items:
            type: object
            required: [row, reasons, original]
            properties:
              row: { type: integer, minimum: 1 }
              reasons:
                type: array
                minItems: 1
                items: { enum: [INVALID_SKU, INVALID_STOCK, DUPLICATE_SKU] }
              original: {}
    ImportHistory:
      type: object
      required: [attempts, retries]
      properties:
        attempts:
          type: array
          items:
            type: object
            required: [generation, id, outcome, startedAt, finishedAt]
            properties:
              generation: { type: integer, minimum: 1, maximum: 6 }
              id: { type: string, format: uuid }
              outcome: { enum: [running, succeeded, technical_failure, superseded] }
              startedAt: { type: string, format: date-time }
              finishedAt: { type: [string, 'null'], format: date-time }
        retries:
          type: array
          items:
            type: object
            required: [generation, requestedBy, requestedAt]
            properties:
              generation: { type: integer, minimum: 2, maximum: 6 }
              requestedBy: { type: string }
              requestedAt: { type: string, format: date-time }
    RetryReceipt:
      type: object
      required: [importId, generation, status]
      properties:
        importId: { type: string, format: uuid }
        generation: { type: integer, minimum: 2, maximum: 6 }
        status: { const: pending }
    SupplierMetrics:
      type: object
      required:
        [
          pendingImports,
          failedImports,
          completedImports,
          outboxBacklog,
          processingAttempts,
          failedAttempts,
          meanCompletionMs,
        ]
      properties:
        pendingImports: { type: integer, minimum: 0 }
        failedImports: { type: integer, minimum: 0 }
        completedImports: { type: integer, minimum: 0 }
        outboxBacklog: { type: integer, minimum: 0 }
        processingAttempts: { type: integer, minimum: 0 }
        failedAttempts: { type: integer, minimum: 0 }
        meanCompletionMs: { type: [number, 'null'], minimum: 0 }
    Failure:
      type: object
      required: [status, code, message]
      properties:
        status: { type: integer }
        code: { type: string }
        message: { type: string }
